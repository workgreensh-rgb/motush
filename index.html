<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모투장 · 친구들과 겨루는 모의투자</title>
<style>
:root{--bg:#0B0E14;--panel:#141926;--panel2:#1B2233;--line:#252D42;--tx:#DCE3F0;--dim:#8B94AB;
--up:#F0424D;--dn:#4C82F7;--gold:#E8B84B;}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--tx);
font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
font-feature-settings:'tnum';padding-bottom:70px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.hd{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.hdrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.logo{font-weight:800;font-size:18px;letter-spacing:-.5px}
.logo em{font-style:normal;color:var(--gold)}
.eq{text-align:right;font-size:12px;color:var(--dim)}
.eq b{display:block;font-size:16px;color:var(--tx)}
.tabs{display:flex;gap:4px}
.tab{flex:1;padding:10px 0;text-align:center;font-size:14px;color:var(--dim);border:none;
background:none;cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.tab.on{color:var(--tx);border-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.grow{flex:1;min-width:0}
.nm{font-weight:700;font-size:14px}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
.pr{text-align:right}
.pr b{font-size:14px}
.up{color:var(--up)}.dn{color:var(--dn)}
.btn{border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer}
.btn.b{background:var(--up);color:#fff}.btn.s{background:var(--dn);color:#fff}
.btn.g{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);
border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-size:13px;z-index:20;
white-space:nowrap;display:none}
.ov{position:fixed;inset:0;background:rgba(4,6,10,.7);display:none;align-items:center;
justify-content:center;z-index:10;padding:16px}
.ov.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:360px}
.in{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);
padding:11px 12px;font-size:15px;margin-top:8px}
.in:focus{outline:2px solid var(--gold);outline-offset:-1px}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:8px}
.kv b{color:var(--tx)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lgbox{width:100%;max-width:380px}
.big{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.2}
.note{font-size:12px;color:var(--dim);line-height:1.6;margin-top:14px}
.rk{width:26px;text-align:center;font-weight:800;color:var(--dim)}
.rk.top{color:var(--gold)}
.hidden{display:none!important}
.sidebtn{display:flex;gap:6px;margin-top:14px}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginView" class="login">
  <div class="lgbox">
    <div class="big">모투장 <span style="color:var(--gold)">·</span></div>
    <div class="big" style="color:var(--dim);font-size:18px;margin-top:6px">친구들과 겨루는 모의투자</div>
    <input class="in" id="nickIn" placeholder="닉네임 입력" maxlength="20" style="margin-top:24px">
    <button class="btn b" style="width:100%;margin-top:10px;padding:13px" onclick="login()">시작하기 · 시드머니 1억</button>
    <div class="note">
      같은 기기·같은 닉네임으로 접속하면 기존 계좌를 이어서 씁니다.
      시세는 가상 종목의 시뮬레이션 가격이며, 시각 기반으로 생성되어
      어떤 기기에서 접속해도 모든 참가자가 완전히 동일한 시세를 봅니다.
    </div>
  </div>
</div>

<!-- 메인 -->
<div id="mainView" class="hidden">
  <div class="hd">
    <div class="wrap">
      <div class="hdrow">
        <div class="logo">모투장 <em>·</em> <span id="hdName" style="font-size:13px;color:var(--dim);font-weight:600"></span></div>
        <div class="eq num">총자산<b id="hdEquity"></b></div>
      </div>
      <div class="tabs">
        <button class="tab on" data-tab="market" onclick="setTab('market')">시장</button>
        <button class="tab" data-tab="port" onclick="setTab('port')">내 계좌</button>
        <button class="tab" data-tab="rank" onclick="setTab('rank')">랭킹</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div id="marketTab"></div>
    <div id="portTab" class="hidden"></div>
    <div id="rankTab" class="hidden"></div>
  </div>
</div>

<!-- 주문 모달 -->
<div class="ov" id="orderOv" onclick="if(event.target===this)closeModal()">
  <div class="dlg">
    <div class="nm" style="font-size:16px" id="mName"></div>
    <div class="sub num" id="mPrice"></div>
    <div style="display:flex;gap:6px;margin-top:14px">
      <button class="btn g" id="mBuyBtn" style="flex:1" onclick="setSide('buy')">매수</button>
      <button class="btn g" id="mSellBtn" style="flex:1" onclick="setSide('sell')">매도</button>
    </div>
    <input class="in" type="number" min="1" id="mQty" placeholder="수량 (주)" oninput="renderModalCalc()">
    <div class="sidebtn">
      <button class="btn g" style="flex:1" onclick="setMaxQty()">최대</button>
    </div>
    <div id="mCalc"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn g" style="flex:1" onclick="closeModal()">취소</button>
      <button class="btn b" id="mSubmit" style="flex:2" onclick="trade()">매수 주문</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ───────── 상수 ───────── */
var EPOCH = Date.UTC(2026,0,1);
var START_CASH = 100000000;
var FEE_RATE = 0.00015;
var TICKERS = [
  {code:"HBC",name:"한빛건설",sector:"건설",base:42500,vol:1.0},
  {code:"CRN",name:"청룡원자력",sector:"원전",base:128000,vol:1.3},
  {code:"MRP",name:"미르전력",sector:"유틸",base:23800,vol:0.6},
  {code:"NRS",name:"나래반도체",sector:"IT",base:87400,vol:1.6},
  {code:"OSB",name:"온새미바이오",sector:"바이오",base:156000,vol:2.2},
  {code:"GAB",name:"가온배터리",sector:"2차전지",base:64200,vol:1.8},
  {code:"BDS",name:"바다조선",sector:"조선",base:31900,vol:1.2},
  {code:"SBC",name:"새벽커머스",sector:"플랫폼",base:48700,vol:1.5},
  {code:"HGF",name:"한결금융",sector:"금융",base:71300,vol:0.7},
  {code:"DRE",name:"두루엔터",sector:"엔터",base:95600,vol:1.9}
];

/* ───────── 저장소 (localStorage, 실패 시 메모리) ───────── */
var mem = {};
var store = {
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]||null; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  keys:function(prefix){
    var out=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf(prefix)===0)out.push(k);
      }
    }catch(e){ for(var k2 in mem){ if(k2.indexOf(prefix)===0)out.push(k2);} }
    return out;
  }
};

/* ───────── 결정론적 시세 엔진 ───────── */
function hashStr(s){var h=1779033703^s.length;for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
var waveCache={};
function wavesFor(code){
  if(waveCache[code])return waveCache[code];
  var rng=mulberry32(hashStr("mt-"+code));
  var periods=[4,17,63,240,1440,4320,10080];
  var waves=periods.map(function(p,i){return{p:p,amp:(0.004+rng()*0.01)*Math.sqrt(i+1),ph:rng()*Math.PI*2};});
  var drift=(rng()-0.45)*0.000004;
  waveCache[code]={waves:waves,drift:drift,seed:hashStr("j-"+code)};
  return waveCache[code];
}
function priceAt(t,tk){
  var w=wavesFor(tk.code),lo=w.drift*t;
  for(var i=0;i<w.waves.length;i++){var wv=w.waves[i];lo+=wv.amp*tk.vol*Math.sin(2*Math.PI*t/wv.p+wv.ph);}
  var m=Math.floor(t);
  var j=(mulberry32(w.seed^m)()-0.5)*0.006*tk.vol;
  var raw=tk.base*Math.exp(lo+j);
  var tick=raw>=100000?100:raw>=10000?50:10;
  return Math.max(tick,Math.round(raw/tick)*tick);
}
function nowMin(){return (Date.now()-EPOCH)/60000;}
function quotes(){
  var t=nowMin();
  return TICKERS.map(function(tk){
    var p=priceAt(t,tk),prev=priceAt(t-1440,tk);
    return Object.assign({},tk,{price:p,chg:(p-prev)/prev*100});
  });
}

/* ───────── 유틸 ───────── */
function fmt(n){return Math.round(n).toLocaleString("ko-KR");}
function pct(n){return (n>=0?"+":"")+n.toFixed(2)+"%";}
function sanitizeId(s){return s.trim().replace(/[\s\/\\'"]+/g,"_").slice(0,20);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var toastTimer=null;
function flash(m){
  var t=document.getElementById("toast");
  t.textContent=m;t.style.display="block";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.style.display="none";},3000);
}

/* ───────── 상태 ───────── */
var me=null, curTab="market", modal=null;

function loadPlayer(id){
  var raw=store.get("mt:player:"+id);
  return raw?JSON.parse(raw):null;
}
function savePlayer(p){store.set("mt:player:"+p.id,JSON.stringify(p));}
function equityOf(p,qs){
  var eq=p.cash;
  for(var code in p.holdings){
    var qq=qs.find(function(x){return x.code===code;});
    if(qq)eq+=qq.price*p.holdings[code].qty;
  }
  return eq;
}

/* ───────── 로그인 ───────── */
function login(){
  var nick=document.getElementById("nickIn").value;
  var id=sanitizeId(nick);
  if(!id){flash("닉네임을 입력해 주세요.");return;}
  me=loadPlayer(id);
  if(!me){
    me={id:id,name:nick.trim(),cash:START_CASH,holdings:{},trades:[],created:Date.now()};
    savePlayer(me);
  }
  store.set("mt:last",id);
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("mainView").classList.remove("hidden");
  renderAll();
}
document.getElementById("nickIn").addEventListener("keydown",function(e){if(e.key==="Enter")login();});

/* ───────── 렌더링 ───────── */
function setTab(t){
  curTab=t;
  document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.tab===t);});
  ["market","port","rank"].forEach(function(k){
    document.getElementById(k+"Tab").classList.toggle("hidden",k!==t);
  });
  renderAll();
}

function sparkSvg(tk,up){
  var t=nowMin(),pts=[];
  for(var i=0;i<36;i++)pts.push(priceAt(t-(35-i)*40,tk));
  var min=Math.min.apply(null,pts),max=Math.max.apply(null,pts),rng=max-min||1;
  var pl=pts.map(function(p,i){return ((i/35)*84).toFixed(1)+","+(26-((p-min)/rng)*22).toFixed(1);}).join(" ");
  return '<svg width="84" height="28" style="display:block"><polyline points="'+pl+'" fill="none" stroke="'+(up?"var(--up)":"var(--dn)")+'" stroke-width="1.5"/></svg>';
}

function renderHeader(qs){
  var eq=equityOf(me,qs);
  var ret=(eq-START_CASH)/START_CASH*100;
  document.getElementById("hdName").textContent=me.name;
  document.getElementById("hdEquity").innerHTML=fmt(eq)+'원 <span class="'+(ret>=0?"up":"dn")+'" style="font-size:12px">'+pct(ret)+'</span>';
}

function renderMarket(qs){
  var h='<div class="card">';
  qs.forEach(function(tk){
    h+='<div class="row"><div class="grow"><div class="nm">'+tk.name+'</div><div class="sub">'+tk.sector+' · '+tk.code+'</div></div>'
      +sparkSvg(tk,tk.chg>=0)
      +'<div class="pr num" style="width:92px"><b>'+fmt(tk.price)+'</b><div class="sub"><span class="'+(tk.chg>=0?"up":"dn")+'">'+pct(tk.chg)+'</span></div></div>'
      +'<button class="btn g" onclick="openModal(\''+tk.code+'\',\'buy\')">거래</button></div>';
  });
  h+='<div class="row" style="justify-content:center"><span class="sub">등락률은 24시간 전 대비 · 시세는 5초마다 갱신</span></div></div>';
  document.getElementById("marketTab").innerHTML=h;
}

function renderPort(qs){
  var eq=equityOf(me,qs);
  var ret=(eq-START_CASH)/START_CASH*100;
  var h='<div class="card">'
    +'<div class="row"><div class="grow sub">예수금</div><b class="num">'+fmt(me.cash)+'원</b></div>'
    +'<div class="row"><div class="grow sub">평가금액</div><b class="num">'+fmt(eq-me.cash)+'원</b></div>'
    +'<div class="row"><div class="grow sub">총 수익률</div><b class="num '+(ret>=0?"up":"dn")+'">'+pct(ret)+'</b></div></div>';
  h+='<div class="card">';
  var codes=Object.keys(me.holdings);
  if(codes.length===0)h+='<div class="row"><span class="sub">보유 종목이 없습니다. 시장 탭에서 첫 매수를 해보세요.</span></div>';
  codes.forEach(function(code){
    var hd=me.holdings[code];
    var qq=qs.find(function(x){return x.code===code;});
    var avg=hd.cost/hd.qty, pl=(qq.price-avg)/avg*100;
    h+='<div class="row"><div class="grow"><div class="nm">'+qq.name+'</div><div class="sub num">'+hd.qty+'주 · 평단 '+fmt(avg)+'원</div></div>'
      +'<div class="pr num"><b>'+fmt(qq.price*hd.qty)+'원</b><div class="sub"><span class="'+(pl>=0?"up":"dn")+'">'+pct(pl)+'</span></div></div>'
      +'<button class="btn s" onclick="openModal(\''+code+'\',\'sell\')">매도</button></div>';
  });
  h+='</div>';
  if(me.trades.length>0){
    h+='<div class="card">';
    me.trades.slice(0,8).forEach(function(tr){
      var d=new Date(tr.ts);
      h+='<div class="row"><div class="grow"><div class="nm" style="font-size:13px"><span class="'+(tr.side==="buy"?"up":"dn")+'">'+(tr.side==="buy"?"매수":"매도")+'</span> '+tr.name+'</div>'
        +'<div class="sub">'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,"0")+':'+String(d.getMinutes()).padStart(2,"0")+'</div></div>'
        +'<div class="pr num sub">'+tr.n+'주 · '+fmt(tr.price)+'원</div></div>';
    });
    h+='</div>';
  }
  document.getElementById("portTab").innerHTML=h;
}

function renderRank(qs){
  var rows=store.keys("mt:player:").map(function(k){
    try{var p=JSON.parse(store.get(k));return{name:p.name,id:p.id,eq:equityOf(p,qs)};}catch(e){return null;}
  }).filter(Boolean).sort(function(a,b){return b.eq-a.eq;});
  var h='<div class="card"><div class="row"><div class="grow nm">이 기기의 참가자 랭킹</div>'
    +'<button class="btn g" onclick="copyResult()">내 성적 복사</button></div>';
  if(rows.length===0)h+='<div class="row"><span class="sub">아직 참가자가 없습니다.</span></div>';
  rows.forEach(function(r,i){
    var rr=(r.eq-START_CASH)/START_CASH*100;
    h+='<div class="row"><div class="rk num'+(i<3?" top":"")+'">'+(i+1)+'</div>'
      +'<div class="grow nm">'+esc(r.name)+(r.id===me.id?'<span class="sub"> (나)</span>':'')+'</div>'
      +'<div class="pr num"><b>'+fmt(r.eq)+'원</b><div class="sub"><span class="'+(rr>=0?"up":"dn")+'">'+pct(rr)+'</span></div></div></div>';
  });
  h+='<div class="row"><span class="sub">시세가 모든 기기에서 동일하므로, 각자 "내 성적 복사"로 수익률을 공유해 비교하면 공정한 경쟁이 됩니다.</span></div></div>';
  document.getElementById("rankTab").innerHTML=h;
}

function copyResult(){
  var qs=quotes();
  var eq=equityOf(me,qs);
  var ret=(eq-START_CASH)/START_CASH*100;
  var txt="[모투장] "+me.name+" · 총자산 "+fmt(eq)+"원 ("+pct(ret)+") · "+new Date().toLocaleString("ko-KR");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){flash("복사됐습니다. 단톡방에 붙여넣으세요.");},function(){flash(txt);});
  }else{flash(txt);}
}

function renderAll(){
  if(!me)return;
  var qs=quotes();
  renderHeader(qs);
  if(curTab==="market")renderMarket(qs);
  if(curTab==="port")renderPort(qs);
  if(curTab==="rank")renderRank(qs);
}

/* ───────── 주문 ───────── */
function openModal(code,side){
  var tk=TICKERS.find(function(x){return x.code===code;});
  modal={code:code,side:side,tk:tk};
  document.getElementById("mQty").value="";
  document.getElementById("orderOv").classList.add("show");
  renderModal();
}
function closeModal(){modal=null;document.getElementById("orderOv").classList.remove("show");}
function setSide(s){if(modal){modal.side=s;renderModal();}}
function curPrice(){var t=nowMin();return priceAt(t,modal.tk);}
function renderModal(){
  document.getElementById("mName").textContent=modal.tk.name;
  document.getElementById("mPrice").textContent="현재가 "+fmt(curPrice())+"원";
  var b=document.getElementById("mBuyBtn"),s=document.getElementById("mSellBtn"),sub=document.getElementById("mSubmit");
  b.className="btn "+(modal.side==="buy"?"b":"g");
  s.className="btn "+(modal.side==="sell"?"s":"g");
  sub.className="btn "+(modal.side==="buy"?"b":"s");
  sub.textContent=modal.side==="buy"?"매수 주문":"매도 주문";
  b.style.flex=s.style.flex="1";sub.style.flex="2";
  renderModalCalc();
}
function renderModalCalc(){
  var n=parseInt(document.getElementById("mQty").value,10);
  var el=document.getElementById("mCalc");
  if(!n||n<=0){el.innerHTML="";return;}
  var p=curPrice();
  el.innerHTML='<div class="kv num"><span>주문금액</span><b>'+fmt(p*n)+'원</b></div>'
    +'<div class="kv num"><span>수수료 (0.015%)</span><b>'+fmt(p*n*FEE_RATE)+'원</b></div>';
}
function setMaxQty(){
  var p=curPrice();
  var v = modal.side==="buy" ? Math.floor(me.cash/(p*(1+FEE_RATE))) : (me.holdings[modal.code]?me.holdings[modal.code].qty:0);
  document.getElementById("mQty").value=v;
  renderModalCalc();
}
function trade(){
  var n=parseInt(document.getElementById("mQty").value,10);
  if(!n||n<=0){flash("수량을 입력해 주세요.");return;}
  var p=curPrice(),gross=p*n,fee=Math.round(gross*FEE_RATE);
  if(modal.side==="buy"){
    if(gross+fee>me.cash){flash("현금이 부족합니다.");return;}
    me.cash-=gross+fee;
    var h=me.holdings[modal.code]||{qty:0,cost:0};
    me.holdings[modal.code]={qty:h.qty+n,cost:h.cost+gross};
  }else{
    var h2=me.holdings[modal.code];
    if(!h2||h2.qty<n){flash("보유 수량이 부족합니다.");return;}
    me.cash+=gross-fee;
    var rest=h2.qty-n;
    if(rest===0)delete me.holdings[modal.code];
    else me.holdings[modal.code]={qty:rest,cost:h2.cost*(rest/h2.qty)};
  }
  me.trades.unshift({ts:Date.now(),code:modal.code,name:modal.tk.name,side:modal.side,n:n,price:p});
  me.trades=me.trades.slice(0,30);
  savePlayer(me);
  var nm=modal.tk.name,sd=modal.side;
  closeModal();
  renderAll();
  flash(nm+" "+n+"주 "+(sd==="buy"?"매수":"매도")+" 체결 · "+fmt(p)+"원");
}

/* ───────── 자동 갱신 및 자동 로그인 ───────── */
setInterval(renderAll,5000);
(function(){
  var last=store.get("mt:last");
  if(last){
    var p=loadPlayer(last);
    if(p){
      me=p;
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("mainView").classList.remove("hidden");
      renderAll();
    }
  }
})();
</script>
