<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모투장 · 친구들과 겨루는 모의투자</title>
<style>
:root{--bg:#0B0E14;--panel:#141926;--panel2:#1B2233;--line:#252D42;--tx:#DCE3F0;--dim:#8B94AB;
--up:#F0424D;--dn:#4C82F7;--gold:#E8B84B;}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--tx);
font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
font-feature-settings:'tnum';padding-bottom:70px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}
.hd{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.hdrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:8px}
.logo{font-weight:800;font-size:18px;white-space:nowrap}
.logo em{font-style:normal;color:var(--gold)}
.eq{text-align:right;font-size:12px;color:var(--dim)}
.eq b{display:block;font-size:15px;color:var(--tx)}
.tabs{display:flex;gap:4px}
.tab{flex:1;max-width:120px;padding:10px 0;text-align:center;font-size:14px;color:var(--dim);border:none;
background:none;cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.tab.on{color:var(--tx);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 320px;gap:12px;margin-top:12px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:0}
.mt12{margin-top:12px}
.chead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line)}
.chead .t{font-weight:700;font-size:14px}
.chead .s{font-size:11px;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row.click{cursor:pointer}
.row.click:hover{background:var(--pan2, var(--panel2))}
.grow{flex:1;min-width:0}
.nm{font-weight:700;font-size:13px}
.sub{font-size:11px;color:var(--dim);margin-top:1px}
.pr{text-align:right}
.pr b{font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}
.rk{width:20px;text-align:center;font-weight:800;color:var(--dim);font-size:12px}
.rk.top{color:var(--gold)}
.btn{border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer}
.btn.b{background:var(--up);color:#fff}.btn.s{background:var(--dn);color:#fff}
.btn.g{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.btn.x{background:none;color:var(--dim);border:none;font-size:11px;padding:4px 6px}
.btn:disabled{opacity:.5;cursor:default}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:var(--panel2);
border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-size:13px;z-index:30;
white-space:nowrap;display:none;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.ov{position:fixed;inset:0;background:rgba(4,6,10,.75);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.ov.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:360px}
.dlg.wide{max-width:640px;padding:16px}
.in{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);
padding:11px 12px;font-size:15px;margin-top:8px}
.in:focus{outline:2px solid var(--gold);outline-offset:-1px}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:8px}
.kv b{color:var(--tx)}
.big{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1.2}
.note{font-size:12px;color:var(--dim);line-height:1.6;margin-top:14px}
.switch{margin-top:14px;font-size:13px;color:var(--dim);text-align:center}
.switch a{color:var(--gold);cursor:pointer;font-weight:700}
.hidden{display:none!important}
.sidebtn{display:flex;gap:6px;margin-top:8px}
.feeditem{font-size:12.5px;line-height:1.5;padding:9px 14px;border-bottom:1px solid var(--line)}
.feeditem:last-child{border-bottom:none}
.feeditem .who{color:var(--gold);font-weight:700}
.feeditem .tm{color:var(--dim);font-size:11px;margin-left:6px}
.cal .row{padding:8px 14px}
.cal .d{width:46px;font-size:11px;color:var(--dim);font-weight:700;flex-shrink:0}
.cal .imp{color:var(--gold)}
.coin .icon{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--gold);flex-shrink:0}
.visitors{position:fixed;right:14px;bottom:14px;background:var(--panel2);border:1px solid var(--line);
border-radius:99px;padding:8px 14px;font-size:11.5px;color:var(--dim);z-index:8;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.visitors b{color:var(--tx)}
.visitors .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3ddc84;margin-right:5px;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.3}}
#tvWrap{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:420px}
#tvWrap iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>

<div class="hd">
  <div class="wrap">
    <div class="hdrow">
      <div class="logo">모투장 <em>·</em>
        <span id="hdUser" class="hidden"><span id="hdName" style="font-size:13px;color:var(--dim);font-weight:600"></span>
        <button class="btn x" onclick="logout()">로그아웃</button></span>
        <button id="hdLogin" class="btn g" style="padding:6px 12px;font-size:12px" onclick="openLogin()">로그인</button>
      </div>
      <div class="eq num hidden" id="hdEq">총자산<b id="hdEquity"></b></div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="home" onclick="setTab('home')">홈</button>
      <button class="tab" data-tab="market" onclick="setTab('market')">시장</button>
      <button class="tab" data-tab="port" onclick="setTab('port')">내 계좌</button>
      <button class="tab" data-tab="rank" onclick="setTab('rank')">랭킹</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="homeTab">
    <div class="grid">
      <div class="stack">
        <div class="card">
          <div class="chead"><span class="t">국내 시총 상위</span><span class="s">시가총액순 · 클릭하면 차트</span></div>
          <div id="movers"><div class="row"><span class="sub">시세 수신 중…</span></div></div>
        </div>
        <div class="card">
          <div class="chead"><span class="t">실시간 체결 피드</span><span class="s">모투선수들의 매매</span></div>
          <div id="feedBox"><div class="row"><span class="sub">불러오는 중…</span></div></div>
        </div>
      </div>
      <div class="stack">
        <div class="card cal">
          <div class="chead"><span class="t">📅 증시 캘린더</span><span class="s">이번 주</span></div>
          <div id="calBox"></div>
        </div>
        <div class="card coin">
          <div class="chead"><span class="t">코인 시총 TOP 10</span><span class="s">KRW · 24h</span></div>
          <div id="coinBox"><div class="row"><span class="sub">불러오는 중…</span></div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="marketTab" class="hidden"></div>
  <div id="portTab" class="hidden"></div>
  <div id="rankTab" class="hidden"></div>
</div>

<div class="visitors num"><span class="dot"></span>동시접속 <b id="vAll">-</b> · 선수 <b id="vPl">-</b> · Total <b id="vTot">-</b></div>

<!-- 로그인/회원가입 모달 -->
<div class="ov" id="loginOv" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="dlg">
    <div class="big">모투장 <span style="color:var(--gold)">·</span></div>
    <div style="color:var(--dim);font-size:14px;margin-top:4px;font-weight:700">친구들과 겨루는 모의투자</div>
    <div id="signupFields" class="hidden">
      <input class="in" id="suName" placeholder="닉네임 (랭킹에 표시)" maxlength="20" style="margin-top:16px">
    </div>
    <input class="in" id="lgId" placeholder="아이디 (영문·숫자)" maxlength="20" autocapitalize="none" style="margin-top:10px">
    <input class="in" id="lgPw" type="password" placeholder="비밀번호" maxlength="50">
    <button class="btn b" id="lgBtn" style="width:100%;margin-top:12px;padding:13px" onclick="submitAuth()">로그인</button>
    <div class="switch" id="switchLine">처음이신가요? <a onclick="toggleMode()">회원가입 · 시드머니 1억</a></div>
    <div class="note">계정은 서버에 저장되어 어느 기기에서든 이어집니다. 닉네임·수익률·체결 내역은 참가자 전원에게 공개됩니다. 국내·미국 실제 종목 시세로 거래하며(미국은 지연 가능), 돈은 전부 가상입니다.</div>
  </div>
</div>

<!-- 주문 모달 -->
<div class="ov" id="orderOv" onclick="if(event.target===this)closeModal()">
  <div class="dlg">
    <div class="nm" style="font-size:16px" id="mName"></div>
    <div class="sub num" id="mPrice"></div>
    <div style="display:flex;gap:6px;margin-top:14px">
      <button class="btn g" id="mBuyBtn" style="flex:1" onclick="setSide('buy')">매수</button>
      <button class="btn g" id="mSellBtn" style="flex:1" onclick="setSide('sell')">매도</button>
    </div>
    <input class="in" type="number" min="1" id="mQty" placeholder="수량 (주)" oninput="renderModalCalc()">
    <div class="sidebtn"><button class="btn g" style="flex:1" onclick="setMaxQty()">최대</button></div>
    <div id="mCalc"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn g" style="flex:1" onclick="closeModal()">취소</button>
      <button class="btn b" id="mSubmit" style="flex:2" onclick="trade()">매수 주문</button>
    </div>
  </div>
</div>

<!-- 차트 모달 (TradingView) -->
<div class="ov" id="chartOv" onclick="if(event.target===this)closeChart()">
  <div class="dlg wide">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><span class="nm" id="cName" style="font-size:16px"></span> <span class="sub num" id="cPrice"></span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn b" style="padding:6px 14px;font-size:12px" id="cTradeBtn">거래하기</button>
        <button class="btn x" onclick="closeChart()" style="font-size:16px">✕</button>
      </div>
    </div>
    <div id="tvWrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ───────── 상수 ───────── */
var START_CASH = 100000000;
var FEE_RATE = 0.00015;
var CALENDAR = [
  {d:"8/25 월", t:"국내 8월 소비자심리지수", imp:false, s:""},
  {d:"8/26 화", t:"엔비디아 실적 발표", imp:true, s:"장 마감 후 · AI 수요 가늠자"},
  {d:"8/28 목", t:"한은 금통위", imp:true, s:"기준금리 결정"},
  {d:"8/28 목", t:"미국 2분기 GDP 잠정치", imp:false, s:""},
  {d:"8/29 금", t:"미국 7월 PCE 물가", imp:true, s:"Fed 선호 지표"}
];

/* ───────── 상태 ───────── */
var me=null, curTab="home", modal=null, signupMode=false, busy=false;
var QUOTES={fx:null,list:[]};
var FEED=[], COINS=[];

/* ───────── 유틸 ───────── */
function fmt(n){return Math.round(n).toLocaleString("ko-KR");}
function pct(n){return (n>=0?"+":"")+Number(n).toFixed(2)+"%";}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function ago(ts){var s=Math.floor((Date.now()-ts)/1000);if(s<60)return "방금";if(s<3600)return Math.floor(s/60)+"분 전";if(s<86400)return Math.floor(s/3600)+"시간 전";return Math.floor(s/86400)+"일 전";}
var toastTimer=null;
function flash(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.display="none";},3200);}
function getToken(){try{return localStorage.getItem("mt:token");}catch(e){return window.__tk||null;}}
function setToken(v){try{if(v)localStorage.setItem("mt:token",v);else localStorage.removeItem("mt:token");}catch(e){window.__tk=v;}}
function getVid(){
  try{
    var v=localStorage.getItem("mt:vid");
    if(!v){v=Math.random().toString(36).slice(2,14);localStorage.setItem("mt:vid",v);window.__newV=true;}
    return v;
  }catch(e){
    if(!window.__vid){window.__vid=Math.random().toString(36).slice(2,14);window.__newV=true;}
    return window.__vid;
  }
}
async function api(path,opts){
  opts=opts||{};
  var headers={"Content-Type":"application/json"};
  var tk=getToken();
  if(tk)headers["Authorization"]="Bearer "+tk;
  var r=await fetch(path,{method:opts.method||"GET",headers:headers,body:opts.body?JSON.stringify(opts.body):undefined});
  var data=null;try{data=await r.json();}catch(e){}
  if(!r.ok){var msg=(data&&data.error)?data.error:"요청에 실패했습니다";var err=new Error(msg);err.status=r.status;throw err;}
  return data;
}
function qmap(sym){for(var i=0;i<QUOTES.list.length;i++){if(QUOTES.list[i].sym===sym)return QUOTES.list[i];}return null;}

/* ───────── 데이터 로더 ───────── */
async function loadQuotes(){try{var d=await api("/api/quotes");if(d&&d.list){QUOTES=d;renderAll();}}catch(e){}}
async function loadFeed(){try{var d=await api("/api/feed");if(d&&d.feed){FEED=d.feed;renderFeed();}}catch(e){}}
async function loadCoins(){try{var d=await api("/api/coins");if(d&&d.coins){COINS=d.coins;renderCoins();}}catch(e){}}
async function beat(){
  try{
    var first=!!window.__newV;window.__newV=false;
    var d=await api("/api/presence",{method:"POST",body:{vid:getVid(),first:first}});
    document.getElementById("vAll").textContent=d.now;
    document.getElementById("vPl").textContent=d.players;
    document.getElementById("vTot").textContent=fmt(d.total);
  }catch(e){}
}

/* ───────── 인증 ───────── */
function openLogin(){document.getElementById("loginOv").classList.add("show");}
function toggleMode(){
  signupMode=!signupMode;
  document.getElementById("signupFields").classList.toggle("hidden",!signupMode);
  document.getElementById("lgBtn").textContent=signupMode?"가입하고 시작하기 · 시드 1억":"로그인";
  document.getElementById("switchLine").innerHTML=signupMode
    ?'이미 계정이 있나요? <a onclick="toggleMode()">로그인</a>'
    :'처음이신가요? <a onclick="toggleMode()">회원가입 · 시드머니 1억</a>';
}
async function submitAuth(){
  if(busy)return;
  var id=document.getElementById("lgId").value.trim();
  var pw=document.getElementById("lgPw").value;
  if(!id||!pw){flash("아이디와 비밀번호를 입력해 주세요");return;}
  busy=true;document.getElementById("lgBtn").disabled=true;
  try{
    var body={action:signupMode?"signup":"login",username:id,password:pw};
    if(signupMode)body.name=document.getElementById("suName").value;
    var r=await api("/api/auth",{method:"POST",body:body});
    setToken(r.token);
    document.getElementById("loginOv").classList.remove("show");
    await enterApp();
    beat();
  }catch(e){flash(e.message);}
  busy=false;document.getElementById("lgBtn").disabled=false;
}
function logout(){
  setToken(null);me=null;
  document.getElementById("hdUser").classList.add("hidden");
  document.getElementById("hdEq").classList.add("hidden");
  document.getElementById("hdLogin").classList.remove("hidden");
  if(curTab==="port")setTab("home");
  renderAll();
}
async function enterApp(){
  var acc=await api("/api/account");
  me=acc;
  document.getElementById("hdName").textContent=me.name;
  document.getElementById("hdUser").classList.remove("hidden");
  document.getElementById("hdEq").classList.remove("hidden");
  document.getElementById("hdLogin").classList.add("hidden");
  renderAll();
}
function needLogin(){flash("로그인이 필요합니다");openLogin();}

/* ───────── 탭/렌더 ───────── */
function setTab(t){
  if(t==="port"&&!me){needLogin();return;}
  curTab=t;
  document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.tab===t);});
  ["home","market","port","rank"].forEach(function(k){
    document.getElementById(k+"Tab").classList.toggle("hidden",k!==t);
  });
  if(t==="rank")loadRank();
  if(t==="home"){loadFeed();loadCoins();}
  renderAll();
}
function equityLocal(){
  if(!me)return 0;
  var eq=me.cash;
  for(var code in me.holdings){var q=qmap(code);if(q&&q.price)eq+=q.price*me.holdings[code].qty;}
  return eq;
}
function renderHeader(){
  if(!me)return;
  var eq=equityLocal();
  var ret=(eq-START_CASH)/START_CASH*100;
  document.getElementById("hdEquity").innerHTML=fmt(eq)+'원 <span class="'+(ret>=0?"up":"dn")+'" style="font-size:11px">'+pct(ret)+'</span>';
}

/* 홈: 시총 상위 */
function renderMovers(){
  var krs=QUOTES.list.filter(function(q){return q.market==="KR"&&q.price;});
  krs.sort(function(a,b){return (b.cap||0)-(a.cap||0);});
  krs=krs.slice(0,10);
  if(!krs.length)return;
  var h="";
  krs.forEach(function(q,i){
    var up=(q.chg||0)>=0;
    var capT=q.cap?((q.cap/10000).toFixed(0)+"조"):"";
    h+='<div class="row click" onclick="openChart(\''+q.sym+'\')"><span class="rk num">'+(i+1)+'</span>'
      +'<div class="grow"><div class="nm">'+q.name+'</div><div class="sub num">시총 '+capT+' · '+q.sym+'</div></div>'
      +'<div class="pr num"><b>'+fmt(q.price)+'</b><div class="sub"><span class="'+(up?"up":"dn")+'">'+pct(q.chg||0)+'</span></div></div></div>';
  });
  document.getElementById("movers").innerHTML=h;
}
/* 홈: 피드 */
function renderFeed(){
  var el=document.getElementById("feedBox");
  if(!FEED.length){el.innerHTML='<div class="row"><span class="sub">아직 체결이 없습니다. 첫 거래의 주인공이 되어보세요.</span></div>';return;}
  var h="";
  FEED.forEach(function(f){
    var v=f.side==="buy"?'<span class="up">매수</span>':'<span class="dn">매도</span>';
    h+='<div class="feeditem"><span class="who">'+esc(f.name)+'</span>님이 <b>'+esc(f.stock)+'</b> '+f.qty+'주를 '+fmt(f.price)+'원에 '+v+'했습니다<span class="tm">'+ago(f.ts)+'</span></div>';
  });
  el.innerHTML=h;
}
/* 홈: 캘린더 */
function renderCal(){
  var h="";
  CALENDAR.forEach(function(c){
    h+='<div class="row"><span class="d">'+c.d+'</span><div class="grow"><div class="nm'+(c.imp?' imp':'')+'">'+c.t+'</div>'+(c.s?'<div class="sub">'+c.s+'</div>':'')+'</div></div>';
  });
  document.getElementById("calBox").innerHTML=h;
}
/* 홈: 코인 */
function renderCoins(){
  var el=document.getElementById("coinBox");
  if(!COINS.length)return;
  var h="";
  COINS.forEach(function(c,i){
    var up=c.chg>=0;
    h+='<div class="row"><span class="rk num">'+(i+1)+'</span><div class="icon">'+esc(c.sym)+'</div>'
      +'<div class="grow"><div class="nm">'+esc(c.name)+'</div></div>'
      +'<div class="pr num"><b>'+fmt(c.price)+'</b><div class="sub"><span class="'+(up?"up":"dn")+'">'+pct(c.chg)+'</span></div></div></div>';
  });
  el.innerHTML=h;
}

/* 시장 탭 */
function renderMarket(){
  function section(title,mk,note){
    var h='<div class="card mt12"><div class="chead"><span class="t">'+title+'</span><span class="s">'+note+'</span></div>';
    var any=false;
    QUOTES.list.forEach(function(q){
      if(q.market!==mk)return;
      any=true;
      var up=(q.chg||0)>=0;
      var priceHtml,subHtml="";
      if(q.price==null){priceHtml='<b class="sub">수신 중…</b>';}
      else if(mk==="US"){priceHtml='<b>'+fmt(q.price)+'</b>';subHtml='<div class="sub num">$'+(q.usd!=null?q.usd.toLocaleString("en-US",{maximumFractionDigits:2}):"-")+' · <span class="'+(up?"up":"dn")+'">'+pct(q.chg||0)+'</span></div>';}
      else{priceHtml='<b>'+fmt(q.price)+'</b>';subHtml='<div class="sub"><span class="'+(up?"up":"dn")+'">'+pct(q.chg||0)+'</span></div>';}
      h+='<div class="row click" onclick="openChart(\''+q.sym+'\')"><div class="grow"><div class="nm">'+q.name+'</div><div class="sub">'+q.sector+' · '+q.sym+'</div></div>'
        +'<div class="pr num" style="width:100px">'+priceHtml+subHtml+'</div>'
        +'<button class="btn g" onclick="event.stopPropagation();openModal(\''+q.sym+'\',\'buy\')">거래</button></div>';
    });
    if(!any)h+='<div class="row"><span class="sub">시세 수신 중…</span></div>';
    h+='</div>';
    return h;
  }
  var fxNote=QUOTES.fx?('환율 '+Math.round(QUOTES.fx).toLocaleString()+'원/$'):'';
  var h=section('국내 주식','KR','실시간 · 클릭하면 차트')+section('미국 주식','US','원화 환산 · '+fxNote);
  h+='<div class="card mt12"><div class="row" style="justify-content:center"><span class="sub">시세: 한국투자증권 OpenAPI · 미국 시세는 15분가량 지연될 수 있음 · 약 10초마다 갱신</span></div></div>';
  document.getElementById("marketTab").innerHTML=h;
}

/* 내 계좌 */
function renderPort(){
  if(!me){document.getElementById("portTab").innerHTML="";return;}
  var eq=equityLocal();
  var ret=(eq-START_CASH)/START_CASH*100;
  var h='<div class="card mt12">'
    +'<div class="row"><div class="grow sub">예수금</div><b class="num">'+fmt(me.cash)+'원</b></div>'
    +'<div class="row"><div class="grow sub">평가금액</div><b class="num">'+fmt(eq-me.cash)+'원</b></div>'
    +'<div class="row"><div class="grow sub">총 수익률</div><b class="num '+(ret>=0?"up":"dn")+'">'+pct(ret)+'</b></div></div>';
  h+='<div class="card mt12">';
  var codes=Object.keys(me.holdings);
  if(codes.length===0)h+='<div class="row"><span class="sub">보유 종목이 없습니다. 시장 탭에서 첫 매수를 해보세요.</span></div>';
  codes.forEach(function(code){
    var hd=me.holdings[code];
    var q=qmap(code);
    var name=q?q.name:code;
    var avg=hd.cost/hd.qty;
    var cur=q&&q.price?q.price:avg;
    var pl=(cur-avg)/avg*100;
    h+='<div class="row"><div class="grow"><div class="nm">'+name+'</div><div class="sub num">'+hd.qty+'주 · 평단 '+fmt(avg)+'원</div></div>'
      +'<div class="pr num"><b>'+fmt(cur*hd.qty)+'원</b><div class="sub"><span class="'+(pl>=0?"up":"dn")+'">'+pct(pl)+'</span></div></div>'
      +'<button class="btn s" onclick="openModal(\''+code+'\',\'sell\')">매도</button></div>';
  });
  h+='</div>';
  if(me.trades&&me.trades.length>0){
    h+='<div class="card mt12">';
    me.trades.slice(0,8).forEach(function(tr){
      var d=new Date(tr.ts);
      h+='<div class="row"><div class="grow"><div class="nm" style="font-size:13px"><span class="'+(tr.side==="buy"?"up":"dn")+'">'+(tr.side==="buy"?"매수":"매도")+'</span> '+tr.name+'</div>'
        +'<div class="sub">'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,"0")+':'+String(d.getMinutes()).padStart(2,"0")+'</div></div>'
        +'<div class="pr num sub">'+tr.n+'주 · '+fmt(tr.price)+'원</div></div>';
    });
    h+='</div>';
  }
  document.getElementById("portTab").innerHTML=h;
}

/* 랭킹 */
var lastBoard=null;
async function loadRank(){
  try{var r=await api("/api/rank");lastBoard=r.board;renderRank();}catch(e){flash(e.message);}
}
function renderRank(){
  var h='<div class="card mt12"><div class="chead"><span class="t">통합 실시간 랭킹</span><button class="btn g" style="padding:5px 10px;font-size:11px" onclick="loadRank()">새로고침</button></div>';
  if(!lastBoard)h+='<div class="row"><span class="sub">불러오는 중…</span></div>';
  else if(lastBoard.length===0)h+='<div class="row"><span class="sub">아직 참가자가 없습니다.</span></div>';
  else lastBoard.forEach(function(r,i){
    h+='<div class="row"><div class="rk num'+(i<3?" top":"")+'">'+(i+1)+'</div>'
      +'<div class="grow nm">'+esc(r.name)+(me&&r.username===me.username?'<span class="sub"> (나)</span>':'')+'</div>'
      +'<div class="pr num"><b>'+fmt(r.equity)+'원</b><div class="sub"><span class="'+(r.ret>=0?"up":"dn")+'">'+pct(r.ret)+'</span></div></div></div>';
  });
  h+='<div class="row"><span class="sub">참가자 전원의 계좌를 서버에서 실시간 집계한 순위입니다.</span></div></div>';
  document.getElementById("rankTab").innerHTML=h;
}
function renderAll(){
  renderHeader();
  if(curTab==="home")renderMovers();
  if(curTab==="market")renderMarket();
  if(curTab==="port")renderPort();
  if(curTab==="rank")renderRank();
}

/* ───────── 차트 (TradingView) ───────── */
var chartSym=null;
function tvSymbol(q){
  if(q.market==="KR")return "KRX:"+q.sym;
  return "NASDAQ:"+q.sym;
}
function openChart(sym){
  var q=qmap(sym);
  if(!q){flash("시세 수신 중입니다");return;}
  chartSym=sym;
  document.getElementById("cName").textContent=q.name;
  document.getElementById("cPrice").textContent=q.price?fmt(q.price)+"원 ("+pct(q.chg||0)+")":"";
  document.getElementById("cTradeBtn").onclick=function(){closeChart();openModal(sym,"buy");};
  var url="https://s.tradingview.com/widgetembed/?symbol="+encodeURIComponent(tvSymbol(q))
    +"&interval=D&theme=dark&style=1&locale=kr&hide_top_toolbar=0&hide_side_toolbar=0&withdateranges=1&allow_symbol_change=0";
  document.getElementById("tvWrap").innerHTML='<iframe src="'+url+'" allowfullscreen></iframe>';
  document.getElementById("chartOv").classList.add("show");
}
function closeChart(){
  document.getElementById("chartOv").classList.remove("show");
  document.getElementById("tvWrap").innerHTML="";
}

/* ───────── 주문 ───────── */
function openModal(code,side){
  if(!me){needLogin();return;}
  var q=qmap(code);
  if(!q||!q.price){flash("시세 수신 중입니다. 잠시 후 시도해 주세요");return;}
  modal={code:code,side:side};
  document.getElementById("mQty").value="";
  document.getElementById("orderOv").classList.add("show");
  renderModal();
}
function closeModal(){modal=null;document.getElementById("orderOv").classList.remove("show");}
function setSide(s){if(modal){modal.side=s;renderModal();}}
function curPrice(){var q=qmap(modal.code);return q&&q.price?q.price:0;}
function renderModal(){
  var q=qmap(modal.code);
  document.getElementById("mName").textContent=q.name;
  document.getElementById("mPrice").textContent="현재가 "+fmt(q.price)+"원"+(q.market==="US"?" (환산)":"");
  var b=document.getElementById("mBuyBtn"),s=document.getElementById("mSellBtn"),sub=document.getElementById("mSubmit");
  b.className="btn "+(modal.side==="buy"?"b":"g");
  s.className="btn "+(modal.side==="sell"?"s":"g");
  sub.className="btn "+(modal.side==="buy"?"b":"s");
  sub.textContent=modal.side==="buy"?"매수 주문":"매도 주문";
  renderModalCalc();
}
function renderModalCalc(){
  var n=parseInt(document.getElementById("mQty").value,10);
  var el=document.getElementById("mCalc");
  if(!n||n<=0){el.innerHTML="";return;}
  var p=curPrice();
  el.innerHTML='<div class="kv num"><span>주문금액</span><b>'+fmt(p*n)+'원</b></div>'
    +'<div class="kv num"><span>수수료 (0.015%)</span><b>'+fmt(p*n*FEE_RATE)+'원</b></div>';
}
function setMaxQty(){
  var p=curPrice();
  if(!p)return;
  var v=modal.side==="buy"?Math.floor(me.cash/(p*(1+FEE_RATE))):(me.holdings[modal.code]?me.holdings[modal.code].qty:0);
  document.getElementById("mQty").value=v;
  renderModalCalc();
}
async function trade(){
  if(busy)return;
  var n=parseInt(document.getElementById("mQty").value,10);
  if(!n||n<=0){flash("수량을 입력해 주세요");return;}
  busy=true;document.getElementById("mSubmit").disabled=true;
  try{
    var r=await api("/api/trade",{method:"POST",body:{code:modal.code,side:modal.side,qty:n}});
    me.cash=r.cash;me.holdings=r.holdings;me.trades=r.trades;
    var f=r.filled;
    closeModal();renderAll();loadFeed();
    flash(f.name+" "+f.n+"주 "+(f.side==="buy"?"매수":"매도")+" 체결 · "+fmt(f.price)+"원");
  }catch(e){
    if(e.status===401){flash("세션이 만료됐습니다. 다시 로그인해 주세요");logout();}
    else flash(e.message);
  }
  busy=false;document.getElementById("mSubmit").disabled=false;
}

/* ───────── 시작 ───────── */
document.getElementById("lgPw").addEventListener("keydown",function(e){if(e.key==="Enter")submitAuth();});
renderCal();
setInterval(loadQuotes,10000);
setInterval(beat,20000);
setInterval(function(){if(curTab==="home")loadFeed();},20000);
setInterval(function(){if(curTab==="home")loadCoins();},60000);
(async function(){
  getVid();
  loadQuotes();loadFeed();loadCoins();beat();
  if(getToken()){
    try{await enterApp();}catch(e){setToken(null);}
  }
})();
</script>
