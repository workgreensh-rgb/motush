<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실전 기록 · 비버의 모투장</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#0B0E14;--panel:#141926;--panel2:#1B2233;--line:#252D42;--tx:#DCE3F0;--dim:#8B94AB;--sub:#6F7891;
--up:#F0424D;--dn:#4C82F7;--gold:#E8B84B;--teal:#6fb3aa}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--tx);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-feature-settings:'tnum';padding-bottom:60px}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.hd{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.hdrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:8px}
.logo{font-weight:800;font-size:18px;white-space:nowrap;color:var(--tx);text-decoration:none}
.logo em{font-style:normal;color:var(--gold)}
.back{font-size:12px;color:var(--teal);text-decoration:none;border:1px solid rgba(111,179,170,.35);border-radius:7px;padding:5px 10px}
h1{font-size:20px;font-weight:800;margin:22px 0 4px}
.basis{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12px;color:var(--dim)}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px}
.kpi .s{font-size:11px;color:var(--sub);margin-top:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:12px}
.grid .card{margin-top:0}
.chead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line)}
.chead .t{font-weight:700;font-size:15px}
.chead .n{font-size:11px;color:var(--sub)}
.body{padding:12px 14px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;margin-bottom:12px;background:var(--panel2)}
.srow{display:grid;grid-template-columns:12px minmax(0,1fr) 56px 70px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.sw{width:10px;height:10px;border-radius:2px}
.r{text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
.row:last-child{border-bottom:none}
.tag{font-size:11px;color:var(--sub);margin-left:4px}
.up{color:var(--up)}.dn{color:var(--dn)}.mute{color:var(--sub)}
.tr{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel2)}
.tr:last-child{margin-bottom:0}
.trh{display:flex;justify-content:space-between;align-items:baseline}
.trh b{font-size:15px}
.trh .ret{font-size:15px;font-weight:800}
.meta{font-size:12px;color:var(--dim);margin:3px 0 8px}
.why{font-size:12.5px;line-height:1.6;margin-top:2px}
.why span{color:var(--sub);margin-right:6px}
.tl{display:block;margin:6px 0 4px}
.empty{font-size:13px;color:var(--sub);padding:6px 0}
.foot{font-size:11px;color:var(--sub);margin-top:16px;line-height:1.7}
.err{color:var(--up);font-size:13px;padding:20px 0}
</style>
</head>
<body>
<div class="hd"><div class="wrap"><div class="hdrow">
  <a class="logo" href="/">🦫 비버의 <em>모투장</em></a>
  <a class="back" href="/">모의투자로 돌아가기</a>
</div></div></div>

<div class="wrap">
  <h1>비로의 실전 매매 기록</h1>
  <div class="basis" id="basis">실제 계좌 체결 기준 · 세전·수수료 전 · 수량과 금액은 공개하지 않습니다</div>

  <div class="kpis">
    <div class="kpi"><div class="l">실현 누적 수익률</div><div class="v" id="kCum">-</div><div class="s">금액 가중</div></div>
    <div class="kpi"><div class="l">투입원가 대비 총손익</div><div class="v" id="kTot">-</div><div class="s" id="kTotS">실현 + 보유 평가</div></div>
    <div class="kpi"><div class="l">승률</div><div class="v" id="kWin">-</div><div class="s" id="kWinS"></div></div>
    <div class="kpi"><div class="l">평균 보유</div><div class="v" id="kHold">-</div><div class="s" id="kAvg"></div></div>
  </div>

  <div class="grid" style="margin-top:12px">
    <div class="card"><div class="chead"><span class="t">섹터별</span><span class="n">투입원가 기준 비중</span></div><div class="body" id="secBox"><div class="empty">불러오는 중</div></div></div>
    <div class="card"><div class="chead"><span class="t">종목별</span><span class="n">비중 · 손익률</span></div><div class="body" id="stkBox"><div class="empty">불러오는 중</div></div></div>
  </div>

  <div class="card"><div class="chead"><span class="t">보유 중</span><span class="n" id="openN"></span></div><div class="body" id="openBox"><div class="empty">불러오는 중</div></div></div>
  <div class="card"><div class="chead"><span class="t">실현 거래</span><span class="n" id="closedN"></span></div><div class="body" id="closedBox"><div class="empty">불러오는 중</div></div></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const API = 'https://beaverlog-gamma.vercel.app/api/performance';
const PALETTE = ['#7F77DD','#1D9E75','#D85A30','#D4537E','#378ADD','#BA7517','#639922','#888780'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls = (v) => (v == null ? 'mute' : v > 0 ? 'up' : v < 0 ? 'dn' : '');
const pct = (v, d = 2) => (v == null || !isFinite(v) ? '-' : (v > 0 ? '+' : '') + v.toFixed(d) + '%');
const md = (s) => (s ? s.slice(5).replace('-', '/') : '');
const CUR = { KRW: '원', JPY: '엔', HKD: '홍콩달러', CNY: '위안' };
const MKT = { KR: '', US: '미국', JP: '일본', HK: '홍콩', CN: '중국' };
const money = (n, c) => {
  if (n == null) return '-';
  if (c === 'USD') return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
  return Number(n).toLocaleString('ko-KR', { maximumFractionDigits: c === 'KRW' ? 0 : 2 }) + (CUR[c] || '원');
};

// 보유 종목 현재가: 비버모투 시세 API (국내 6자리 코드, 미국 티커만 지원)
async function livePrice(o) {
  const sym = o.code && /^\d{6}$/.test(o.code) ? o.code : (/^[A-Z.]{1,6}$/.test(o.name) ? o.name : null);
  if (!sym || !(o.currency === 'KRW' || o.currency === 'USD')) return null;
  try {
    const j = await (await fetch('/api/quotes?watch=' + encodeURIComponent(sym))).json();
    const it = (j.list || []).find((x) => x.sym === sym);
    if (!it) return null;
    return o.currency === 'USD' ? it.usd : it.price;
  } catch { return null; }
}

// 진입·청산 타점 미니 차트 (체결가만 사용, 일봉 시세는 아님)
function timeline(points, cur) {
  if (points.length < 2) return '';
  const W = 300, H = 56, P = 8;
  const t = points.map((p) => new Date(p.date).getTime());
  const v = points.map((p) => p.price);
  const t0 = Math.min(...t), t1 = Math.max(...t), v0 = Math.min(...v), v1 = Math.max(...v);
  const x = (i) => P + (t1 > t0 ? (t[i] - t0) / (t1 - t0) : i / (points.length - 1)) * (W - 2 * P);
  const y = (i) => H - P - (v1 > v0 ? (v[i] - v0) / (v1 - v0) : 0.5) * (H - 2 * P);
  const line = points.map((_, i) => x(i).toFixed(1) + ',' + y(i).toFixed(1)).join(' ');
  const dots = points.map((p, i) => p.type === 'buy'
    ? `<polygon points="${x(i)},${y(i) - 6} ${x(i) - 5},${y(i) + 3} ${x(i) + 5},${y(i) + 3}" fill="#F0424D"><title>매수 ${md(p.date)} ${money(p.price, cur)}</title></polygon>`
    : `<polygon points="${x(i)},${y(i) + 6} ${x(i) - 5},${y(i) - 3} ${x(i) + 5},${y(i) - 3}" fill="#4C82F7"><title>매도 ${md(p.date)} ${money(p.price, cur)}</title></polygon>`).join('');
  return `<svg class="tl" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="매수 매도 타점"><polyline points="${line}" fill="none" stroke="#3a4560" stroke-width="1.2" stroke-dasharray="3 3"/>${dots}</svg>`;
}

async function main() {
  let d;
  try {
    const r = await fetch(API);
    d = await r.json();
    if (!d.ok) throw new Error(d.error || 'api');
  } catch (e) {
    document.querySelector('.wrap').insertAdjacentHTML('beforeend', '<div class="err">실전 기록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>');
    return;
  }
  const s = d.summary;
  $('kCum').textContent = pct(s.cumulativeReturnPct); $('kCum').className = 'v ' + cls(s.cumulativeReturnPct);
  $('kWin').textContent = s.winRatePct == null ? '-' : Math.round(s.winRatePct) + '%';
  const wins = Math.round((s.winRatePct || 0) * s.closedTrades / 100);
  $('kWinS').textContent = s.closedTrades ? `${wins}승 ${s.closedTrades - wins}패` : '실현 거래 없음';
  $('kHold').textContent = s.avgHoldDays == null ? '-' : Math.round(s.avgHoldDays) + '일';
  $('kAvg').textContent = s.avgReturnPct == null ? '' : '거래당 평균 ' + pct(s.avgReturnPct);

  // 보유 종목 평가 (현재가 ÷ 평균 타점)
  const evals = {};
  await Promise.all((d.open || []).map(async (o) => {
    const p = await livePrice(o);
    evals[o.code || o.name] = p ? { price: p, ret: (p / o.avgEntry - 1) * 100 } : null;
  }));
  const evalOf = (x) => evals[x.code || x.name];

  // 투입원가 대비 손익 = (실현손익 + 보유 평가손익) ÷ 누적 투입원가. 모두 비율(%)로만 계산
  const unreal = (x) => { const e = evalOf(x); return e && x.openCostSharePct ? x.openCostSharePct * e.ret / 100 : 0; };
  const stocks = (d.stocks || []).map((x) => ({ ...x, totalPct: x.weightPct ? ((x.realizedPnlSharePct || 0) + unreal(x)) / x.weightPct * 100 : null }));
  const totalShare = stocks.reduce((a, x) => a + (x.realizedPnlSharePct || 0) + unreal(x), 0);
  const missing = (d.open || []).filter((o) => !evalOf(o)).length;
  $('kTot').textContent = stocks.length ? pct(totalShare) : '-'; $('kTot').className = 'v ' + cls(totalShare);
  if (missing) $('kTotS').textContent = `보유 ${missing}종목 시세 미반영`;

  // 섹터
  const secs = {};
  stocks.forEach((x) => {
    const g = secs[x.sector] || (secs[x.sector] = { sector: x.sector, w: 0, pnl: 0, n: 0 });
    g.w += x.weightPct || 0; g.pnl += (x.realizedPnlSharePct || 0) + unreal(x); g.n++;
  });
  const secList = Object.values(secs).sort((a, b) => b.w - a.w);
  if (!secList.length) $('secBox').innerHTML = '<div class="empty">아직 기록이 없습니다</div>';
  else {
    const bar = secList.map((g, i) => `<div style="width:${g.w}%;background:${PALETTE[i % PALETTE.length]}" title="${esc(g.sector)} ${g.w.toFixed(1)}%"></div>`).join('');
    const rows = secList.map((g, i) => { const r = g.w ? g.pnl / g.w * 100 : null; return `<div class="srow"><span class="sw" style="background:${PALETTE[i % PALETTE.length]}"></span><span>${esc(g.sector)}<span class="tag">${g.n}종목</span></span><span class="r mute">${g.w.toFixed(1)}%</span><span class="r ${cls(r)}">${pct(r, 1)}</span></div>`; }).join('');
    $('secBox').innerHTML = `<div class="bar">${bar}</div>${rows}`;
  }

  // 종목
  $('stkBox').innerHTML = stocks.length ? stocks.map((x) => `<div class="row"><span>${esc(x.name)}<span class="tag">${esc(x.sector)}${MKT[x.market] ? ' · ' + MKT[x.market] : ''} · ${x.buys + x.sells}회${x.holding ? ' · 보유' : ''}</span></span><span class="r"><span class="mute" style="margin-right:10px">${(x.weightPct || 0).toFixed(1)}%</span><b class="${cls(x.totalPct)}">${pct(x.totalPct, 1)}</b></span></div>`).join('') : '<div class="empty">아직 기록이 없습니다</div>';

  // 보유 중
  const open = d.open || [];
  $('openN').textContent = open.length ? open.length + '종목' : '';
  $('openBox').innerHTML = open.length ? open.map((o) => {
    const e = evalOf(o);
    const pts = (o.entries || []).map((p) => ({ ...p, type: 'buy' }));
    return `<div class="tr"><div class="trh"><b>${esc(o.name)}<span class="tag">${esc(o.sector || '')}${MKT[o.market] ? ' · ' + MKT[o.market] : ''}</span></b><span class="ret ${e ? cls(e.ret) : 'mute'}">${e ? pct(e.ret) : '시세 미지원'}<span class="tag">평가</span></span></div>
      <div class="meta">${md(o.buyDate)} 첫 매수 · 평균 타점 ${money(o.avgEntry, o.currency)}${e ? ' · 현재가 ' + money(e.price, o.currency) : ''}${(o.entries || []).length > 1 ? ' · 분할매수 ' + o.entries.length + '회' : ''}</div>
      ${timeline(pts, o.currency)}
      ${(o.reasons || []).map((r) => `<div class="why"><span>매수 사유</span>${esc(r)}</div>`).join('')}</div>`;
  }).join('') : '<div class="empty">보유 중인 종목이 없습니다</div>';

  // 실현 거래
  const closed = d.closed || [];
  $('closedN').textContent = closed.length ? closed.length + '건' : '';
  $('closedBox').innerHTML = closed.length ? closed.map((c) => {
    const pts = (c.entries || []).map((p) => ({ ...p, type: 'buy' })).concat([{ date: c.sellDate, price: c.sellPrice, type: 'sell' }]);
    return `<div class="tr"><div class="trh"><b>${esc(c.name)}<span class="tag">${MKT[c.market] ? MKT[c.market] : ''}${c.partial ? ' · 일부 매도' : ''}</span></b><span class="ret ${cls(c.returnPct)}">${pct(c.returnPct)}</span></div>
      <div class="meta">${md(c.buyDate)} 매수 ${money(c.avgEntry, c.currency)} → ${md(c.sellDate)} 매도 ${money(c.sellPrice, c.currency)} · ${c.holdDays}일${c.currency !== 'KRW' ? ' · 현지통화 기준' : ''}</div>
      ${timeline(pts, c.currency)}
      ${(c.buyReasons || []).map((r) => `<div class="why"><span>매수 사유</span>${esc(r)}</div>`).join('')}
      ${c.sellReason ? `<div class="why"><span>매도 사유</span>${esc(c.sellReason)}</div>` : ''}</div>`;
  }).join('') : '<div class="empty">아직 실현한 거래가 없습니다</div>';

  $('foot').innerHTML = `기준: ${esc(d.basis)}<br>비중은 누적 투입원가 기준이며 외화 종목은 매수일 기준환율로 환산한 추정치입니다. 섹터 분류: ${esc(d.sectorSource || '-')}.<br>보유 종목 평가는 비버모투 시세(국내·미국)로 계산하며, 그 외 시장은 평가에서 빠집니다. 갱신 ${new Date(d.asof).toLocaleString('ko-KR')}`;
}
const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) {
  document.querySelector('.hd').style.display = 'none';
  document.body.style.paddingBottom = '20px';
  document.querySelector('body > .wrap').style.padding = '0';
  document.querySelector('body > .wrap').style.maxWidth = 'none';
  document.body.style.minHeight = '0';
  const send = () => parent.postMessage({ realH: Math.ceil(document.querySelector('body > .wrap').getBoundingClientRect().height) + 24 }, location.origin);
  new ResizeObserver(send).observe(document.querySelector('body > .wrap'));
  new ResizeObserver(send).observe(document.body);
  window.addEventListener('load', send);
}
main();
</script>
</body>
</html>
